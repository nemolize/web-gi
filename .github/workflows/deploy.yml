name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue production deploys so a rapid second push cannot cancel an
  # in-flight `wrangler deploy`; preview uploads are safe to supersede.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  Deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # `pull-requests: write` is needed only by the PR-description steps, which
    # are themselves gated on `github.event_name == 'pull_request'`.
    permissions:
      contents: read
      pull-requests: write
    # Dependabot security updates are enabled here, unlike in the upstream
    # template, and a Dependabot-triggered run cannot read this workflow's secret.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        name: Show wip message in the PR description
        uses: nemolize/actions/upsert@v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ⏳deployment is in progress..."

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nemolize/actions/setup@v1.5.0

      - run: pnpm run build

      - id: deploy
        name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'versions upload' }}

      - if: ${{ github.event_name == 'pull_request' }}
        name: Show preview URL in the PR description
        uses: nemolize/actions/upsert@v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ${{ steps.deploy.outputs.deployment-url }}"

      - if: ${{ failure() && github.event_name == 'pull_request' }}
        name: Show error message in the PR description
        uses: nemolize/actions/upsert@v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ❌deployment failed."
