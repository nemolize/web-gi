name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nemolize/actions/setup@v1.5.0
      - run: pnpm run lint
      - if: ${{ !cancelled() }}
        name: Verify the workflow lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  Test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nemolize/actions/setup@v1.5.0
      - run: pnpm run test

  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nemolize/actions/setup@v1.5.0
      - run: pnpm run build

  E2ETests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # Without --ipc=host chromium can run out of memory and crash.
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@v7.0.1
      # checkout's own safe.directory lasts only for its step; `prepare` needs it too.
      - run: git config --global --add safe.directory "$(pwd)"
      - uses: nemolize/actions/setup@v1.5.0
      - name: Assert the image ships the Playwright version we depend on
        run: |
          img="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion)")"
          pt="$(node -p "require('@playwright/test/package.json').version")"
          pw="$(node -p "require('playwright/package.json').version")"
          if [ "$pt" != "$img" ] || [ "$pw" != "$img" ]; then
            echo "::error::image ships Playwright $img, but @playwright/test is $pt and playwright is $pw; update the container image tag in job E2ETests to v$pt-noble and its matching digest"
            exit 1
          fi
      - id: e2e
        run: pnpm run test:e2e
      - if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        name: Upload the Playwright test results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
