name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  Test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build

  E2ETests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Without --ipc=host chromium can run out of memory and crash.
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # checkout's own safe.directory lasts only for its step; `prepare` needs it too.
      - run: git config --global --add safe.directory "$(pwd)"
      - uses: ./.github/actions/setup
      - name: Assert the image ships the Playwright version we depend on
        run: |
          img="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion)")"
          pt="$(node -p "require('@playwright/test/package.json').version")"
          pw="$(node -p "require('playwright/package.json').version")"
          if [ "$pt" != "$img" ] || [ "$pw" != "$img" ]; then
            echo "::error::image ships Playwright $img, but @playwright/test is $pt and playwright is $pw; update the container image tag in job E2ETests to v$pt"
            exit 1
          fi
      - run: pnpm test:e2e
